# Shared env for the app services. Hosts use compose service names, which only
# resolve inside the compose network (the host machine uses localhost + the
# published ports from .env instead).
# Credentials and names come from .env (gitignored) with no fallbacks; hosts
# are compose service names, which are topology rather than secrets.
x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:?set in .env}
  DATABASE_URL_READER: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379
  AWS_REGION: ${AWS_REGION:?set in .env}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set in .env}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set in .env}
  S3_ENDPOINT: http://localstack:4566
  S3_QUARANTINE_BUCKET: ${S3_QUARANTINE_BUCKET:?set in .env}
  S3_SERVED_BUCKET: ${S3_SERVED_BUCKET:?set in .env}
  SQS_ENDPOINT: http://localstack:4566
  SQS_PDF_QUEUE_URL: http://localstack:4566/000000000000/wiki-pdf-processing
  BASE_DOMAIN: localhost
  # Public web URL used in invite links (and similar emails). Must be the URL
  # users open in the browser — not an internal compose hostname.
  APP_URL: ${APP_URL:-http://localhost:3000}
  # Required — set in .env (gitignored); see .env.example
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
  # mailhog only runs with the "tools" profile; email sending fails without it.
  SES_ENDPOINT: http://mailhog:1025
  SES_FROM_ADDRESS: noreply@wiki.example.com

x-app-depends: &app-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  localstack:
    condition: service_healthy

services:
  # ─── Web (Next.js) ─────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PUBLIC_COLLAB_WS_URL: ws://localhost:3003
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
      collab:
        condition: service_healthy

  # ─── API ───────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *app-env
      API_PORT: 3001
    ports:
      - "3001:3001"
    depends_on: *app-depends
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ─── Collab (WebSocket) ────────────────────────────────────────────────────
  collab:
    build:
      context: .
      dockerfile: apps/collab/Dockerfile
    environment:
      <<: *app-env
      COLLAB_PORT: 3003
    ports:
      - "3003:3003"
    depends_on: *app-depends
    # healthcheck comes from the Dockerfile (wget /health)

  # ─── Worker (PDF processing, virus scan) ─────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      <<: *app-env
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    depends_on:
      <<: *app-depends
      clamav:
        condition: service_healthy

  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── LocalStack (S3 + SQS) ────────────────────────────────────────────────
  localstack:
    image: localstack/localstack:3.8
    environment:
      - SERVICES=s3,sqs,ses
      - DEFAULT_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues | grep wiki-pdf-processing || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ─── ClamAV (virus scanning) ──────────────────────────────────────────────
  clamav:
    # clamav/clamav has no ARM64 build; the -debian variant does
    image: clamav/clamav-debian:stable
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ─── MailHog (email in dev) ───────────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:
  localstack_data:
  clamav_data:
